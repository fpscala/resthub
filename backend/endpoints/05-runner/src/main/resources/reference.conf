}

telegram {
  bot-token = "YOUR_BOT_TOKEN_HERE"
  bot-token = ${?TELEGRAM_BOT_TOKEN}
  base-url = "https://api.telegram.org"
  base-url = ${?TELEGRAM_BASE_URL}
  use-webhook = false
  use-webhook = ${?TELEGRAM_USE_WEBHOOK}
  webhook-url = ""
  webhook-url = ${?TELEGRAM_WEBHOOK_URL}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

  topics {
    draft-approved = "draft-approved"
    draft-approved = ${?KAFKA_TOPIC_DRAFT_APPROVED}
    listing-approved = "listing.approved"
    listing-approved = ${?KAFKA_TOPIC_LISTING_APPROVED}
  }

  consumer {
    group-id-prefix = "uzbek-jobs"
    group-id-prefix = ${?KAFKA_CONSUMER_GROUP_ID_PREFIX}
    max-poll-records = 100
    max-poll-records = ${?KAFKA_CONSUMER_MAX_POLL_RECORDS}
    session-timeout = 30.seconds
    heartbeat-interval = 3.seconds
    enable-auto-commit = false
  }

  producer {
    acks = "all"
    retries = 3
    batch-size = 16384
    linger-ms = 10
    buffer-memory = 33554432
    compression-type = "snappy"
  }
}
