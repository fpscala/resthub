version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nesthub-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: nesthub
      POSTGRES_USER: nesthub
      POSTGRES_PASSWORD: NesthubSecure1!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/endpoints/01-repos/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesthub_user -d nesthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: nesthub-redis
    volumes:
      - redis_data:/data
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 for file storage
  minio:
    image: minio/minio:latest
    container_name: nesthub-minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - nesthub-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Scala Backend API
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nesthub-backend-api
    hostname: endpoints
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio.scala.uz
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nesthub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nesthub-frontend
    hostname: frontend
    environment:
      NEXT_PUBLIC_API_URL: http://nest.scala.uz/api
      NEXT_PUBLIC_S3_BUCKET_URL: http://minio.scala.uz
    depends_on:
      - backend-api
    networks:
      - nesthub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL certificates
  certbot:
    image: nbraun1/certbot
    container_name: certbot
    depends_on:
      - nginx
    environment:
      EMAIL: admin@scala.uz
      DOMAINS: nest.scala.uz
      AUTHENTICATOR: webroot
      WEBROOT_PATH: /var/www/letsencrypt
      POST_HOOK_CMD: docker kill -s HUP $$(docker ps --filter "name=webserver" | awk '{print $$1}')
      CRON: "0 */12 * * *"
    networks:
      - external-net
    volumes:
      - ./data/certbot/letsencrypt:/etc/letsencrypt
      - ./data/certbot/www:/var/www/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Nginx Reverse Proxy (Optional, for production)
  nginx:
    image: nginx:alpine
    container_name: nesthub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs:/etc/nginx/conf.d
      - ./data/certbot/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/letsencrypt:ro
    depends_on:
      - backend-api
      - frontend
    networks:
      - nesthub-network
    restart: unless-stopped
    profiles:
      - production
    command: '/bin/sh -c ''while :; do nginx -g "daemon off;"; sleep 30; done'''

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  nesthub-network:
    driver: bridge