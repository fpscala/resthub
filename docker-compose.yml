version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nesthub-postgres
    environment:
      POSTGRES_DB: nesthub
      POSTGRES_USER: nesthub_user
      POSTGRES_PASSWORD: nesthub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/endpoints/01-repos/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesthub_user -d nesthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: nesthub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 for file storage
  minio:
    image: minio/minio:latest
    container_name: nesthub-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - nesthub-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Scala Backend API
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nesthub-backend-api
    env_file:
      - .env
    environment:
      # Override Docker-specific values
      DATABASE_URL: jdbc:postgresql://postgres:5432/nesthub
      DATABASE_USER: nesthub_user
      DATABASE_PASSWORD: nesthub_password
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nesthub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Telegram Bot Service (separate container for better isolation)
  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: bot-service  # Assuming multi-stage build
    container_name: nesthub-telegram-bot
    env_file:
      - .env
    environment:
      # Override Docker-specific values
      DATABASE_URL: jdbc:postgresql://postgres:5432/nesthub
      DATABASE_USER: nesthub_user
      DATABASE_PASSWORD: nesthub_password
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}/webhook
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nesthub-network
    restart: unless-stopped
    command: ["--mode", "bot"]  # Assuming CLI argument for bot mode

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nesthub-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_S3_BUCKET_URL: http://localhost:9000/nesthub-uploads
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - nesthub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: nesthub-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks:
      - nesthub-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - production

  # Nginx Reverse Proxy (Optional, for production)
  nginx:
    image: nginx:alpine
    container_name: nesthub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend-api
      - frontend
    networks:
      - nesthub-network
    restart: unless-stopped
    profiles:
      - production
    command: '/bin/sh -c ''while :; do nginx -g "daemon off;"; sleep 30; done'''

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  nesthub-network:
    driver: bridge