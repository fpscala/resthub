services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: nesthub
      POSTGRES_USER: nesthub
      POSTGRES_PASSWORD: NesthubSecure1!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/endpoints/01-repos/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesthub_user -d nesthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - nesthub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 for file storage
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - nesthub-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Scala Backend API
  backend-api:
    image: fpscala/nesthub-endpoints:latest
    container_name: endpoints
    hostname: endpoints
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio.scala.uz
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nesthub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  frontend:
    image: fpscala/nesthub-frontend:latest
    container_name: frontend
    hostname: frontend
    environment:
      BACKEND_API_URL: http://endpoints:8000/api
      NEXT_PUBLIC_S3_BUCKET_URL: http://minio.scala.uz
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      - backend-api
    networks:
      - nesthub-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional, for production)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./data/certbot/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/letsencrypt:ro
    depends_on:
      - backend-api
      - frontend
    networks:
      - nesthub-network
    restart: unless-stopped
    command: '/bin/sh -c ''while :; do nginx -g "daemon off;"; sleep 30; done'''

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/letsencrypt:/etc/letsencrypt
      - ./data/certbot/www:/var/www/letsencrypt
    entrypoint: >
      sh -c "
      certbot certonly --webroot
      -w /var/www/letsencrypt
      -d nest.scala.uz
      --email admin@scala.uz
      --agree-tos
      --no-eff-email
      && docker kill -s HUP nginx
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  nesthub-network:
    driver: bridge