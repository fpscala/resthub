server {
  listen 80;
  server_name nest.scala.uz www.nest.scala.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name nest.scala.uz www.nest.scala.uz;

  ssl_certificate /etc/nginx/certs/live/nest.scala.uz/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/nest.scala.uz/privkey.pem;
  client_max_body_size 50M;
  location /api/v1/ {
    proxy_pass http://endpoints:8000/;
      proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}